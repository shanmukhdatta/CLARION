name: CLARION security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject obvious committed credentials
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"ghp_[A-Za-z0-9]{30,}"),
          ]
          for root in ("src", "scripts", "configs"):
              for path in pathlib.Path(root).rglob("*"):
                  if not path.is_file() or path.suffix not in {".py", ".yaml", ".sh", ".json"}:
                      continue
                  source = path.read_text(encoding="utf-8")
                  if any(pattern.search(source) for pattern in patterns):
                      raise SystemExit(f"Potential committed credential: {path}")
          print("No obvious credential literals in source folders")
          PY
      - name: Verify offline socket protection
        run: |
          python -m pip install -r requirements-demo.txt -e . pytest
          python -m pytest tests/offline -q
