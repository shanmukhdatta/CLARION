name: CLARION CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and demo requirements
        run: python -m pip install -r requirements-demo.txt -e . pytest
      - name: Run full offline test suite
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Validate per-folder technical READMEs and index
        run: python scripts/docs/generate_folder_readmes.py --check
