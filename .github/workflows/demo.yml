name: CLARION synthetic demo
on:
  push:
    branches: ['implementation/**']
  pull_request:
    paths:
      - 'src/clarion/application/**'
      - 'src/clarion/api/main.py'
      - 'src/clarion/cli/main.py'
      - 'tests/test_engine.py'
      - 'requirements-demo.txt'
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . -r requirements-demo.txt pytest
      - run: python -m pytest tests/test_engine.py -q
      - run: python -m clarion.cli.main generate-demo --out /tmp/demo --cases 36 --seed 26
      - run: python -m clarion.cli.main train-demo --data /tmp/demo --out /tmp/demo-model
      - run: python -m clarion.cli.main investigate --data /tmp/demo --out /tmp/demo-run --predictions /tmp/demo-model/predictions.json
