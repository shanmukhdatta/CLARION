name: CLARION submission acceptance
on:
  pull_request:
    paths:
      - 'src/clarion/v4/**'
      - 'scripts/submission_demo.py'
      - 'scripts/train/**'
      - 'scripts/release/**'
      - 'tests/v4/**'
      - 'docs/index.html'
      - 'docs/showcase.css'
      - 'docs/showcase.js'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'src/clarion/api/**'
      - '.github/workflows/submission-acceptance.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r requirements-v4.txt -r requirements-demo.txt pytest ruff
      - run: python -m pytest -q tests/v4
      - run: python -m ruff check src/clarion/v4 scripts/submission_demo.py scripts/train/run_submission_gnn.py scripts/train/record_mlflow.py scripts/release/check_submission.py tests/v4
      - run: python scripts/submission_demo.py run --out /tmp/clarion-submission --cases 10 --seed 26
      - run: python scripts/release/check_submission.py --run /tmp/clarion-submission/investigation
      - name: Full synthetic training, holdout inference and v4 flow
        run: |
          python scripts/full_demo_pipeline.py --out /tmp/clarion-full --cases 36 --seed 26
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/clarion-full')
          report=json.loads((root/'DEMO_REPORT.json').read_text())
          assert report['training_status']=='SYNTHETIC_EXPERIMENT_ONLY'
          assert report['evidence_inspector']['result']=='VALIDATED_DEMO_ARTIFACT_CONTRACT'
          assert (root/'training/predictions.json').exists()
          assert (root/'investigation/training_experiment.json').exists()
          print('Verified actual synthetic training and inference artifacts')
          PY
      - run: python scripts/train/record_mlflow.py --run /tmp/clarion-submission/investigation --out /tmp/clarion-submission/mlops
      - name: Print exact generated README updates for maintainer sync
        run: |
          python scripts/docs/generate_folder_readmes.py --write
          python - <<'PY'
          import json
          from pathlib import Path
          for f in ("docs/README.md", "scripts/README.md", "scripts/release/README.md",
                    "scripts/train/README.md", "src/clarion/v4/README.md", "tests/v4/README.md"):
              print("CLARION_DOCSYNC_JSON=" + json.dumps({"path": f, "content": Path(f).read_text(encoding="utf-8")}))
          PY
      - name: Check documentation UI includes explicit synthetic safeguards
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('docs/index.html').read_text()
          assert 'DEMO DATA ONLY' in html
          assert 'MODEL_NOT_CONNECTED' in Path('docs/showcase.js').read_text()
          assert 'No owner inference.' in html
          print('Static showcase safety/status labels verified')
          PY

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify Compose configuration
        run: docker compose config --quiet
      - name: Build and start localhost-only fictional demo
        run: |
          docker compose up -d --build --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health
          curl --fail --silent --show-error http://127.0.0.1:8000/api/models/readiness
          curl --fail --silent --show-error http://127.0.0.1:8000/api/provenance/verify
      - name: Show diagnostics and stop
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --tail=80 || true
          docker compose down || true
