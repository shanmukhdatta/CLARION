# Compute profile: NVIDIA CUDA GPU for graph models, falling back to CPU if no GPU is usable.
# Every key is required and unknown keys are rejected; schema: src/clarion/core/config.py.
schema_version: 1
kind: compute
name: gpu
description: CUDA GPU when available, otherwise CPU.
device: cuda
cpu_fallback: true
network_access: deny
limits:
  # Initial engineering ceilings; revisit with real measurements in P5 performance tests.
  max_input_file_mb: 512
  max_workers: 4
