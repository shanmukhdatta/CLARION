# Compute profile: CPU only, the minimum supported hardware (architecture spec §15.1).
# Every key is required and unknown keys are rejected; schema: src/clarion/core/config.py.
schema_version: 1
kind: compute
name: cpu
description: Linux CPU only; no GPU required.
device: cpu
cpu_fallback: false
network_access: deny
limits:
  # Initial engineering ceilings; revisit with real measurements in P5 performance tests.
  max_input_file_mb: 512
  max_workers: 4
